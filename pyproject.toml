[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chemicheck119-data"
version = "0.1.0"
description = "Reproducible dataset inspection and manifest tooling for ChemiCheck119"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.25.1",
  "numpy==2.3.5",
  "scipy==1.16.3",
]

[project.scripts]
chemicheck119-aihub119 = "chemicheck119_data.aihub119:main"
chemicheck119-aihub119-evaluation-manifest = "chemicheck119_data.aihub119_evaluation:main"
chemicheck119-radio-simulation = "chemicheck119_data.radio_simulation:main"
chemicheck119-aihub119-training-split = "chemicheck119_data.training_split:main"
chemicheck119-lora-derived-artifacts = "chemicheck119_data.lora_artifacts:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chemicheck119_data = ["schemas/*.schema"]
