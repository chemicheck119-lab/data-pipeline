[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chemicheck119-data"
version = "0.1.0"
description = "Reproducible dataset inspection and manifest tooling for ChemiCheck119"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.25.1"]

[project.scripts]
chemicheck119-aihub119 = "chemicheck119_data.aihub119:main"

[tool.setuptools.packages.find]
where = ["src"]
