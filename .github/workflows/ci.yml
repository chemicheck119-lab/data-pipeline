name: Data Pipeline CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data-policy-check:
    name: data-policy-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Check every file path introduced by the pull request
        if: github.event_name == 'pull_request'
        run: python scripts/check_repository_policy.py --base-ref "${{ github.event.pull_request.base.sha }}"
      - name: Check every file path introduced by the push
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            python scripts/check_repository_policy.py --all-history
          else
            python scripts/check_repository_policy.py --base-ref "$BEFORE_SHA"
          fi
